const REQ=3;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return localStorage.getItem(k)===JSON.stringify(v)}catch(e){return false}}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const S={day:'fr',done:load('cr_done',{}),filter:'alle',st:load('cr_st',{}),cnt:load('cr_cnt',{}),struck:load('cr_struck',{}),notes:load('cr_notes',{}),
 oral:load('cr_oral',true),queue:[],pos:0,picked:null,shown:false,options:[],showStruck:false,storageOk:null,lastSave:'',ioMsg:''};
S.storageOk=save('cr_test',1);
function persist(){const ok=[save('cr_st',S.st),save('cr_cnt',S.cnt),save('cr_struck',S.struck),save('cr_notes',S.notes),save('cr_done',S.done)].every(Boolean);
 S.storageOk=ok;S.lastSave=ok?new Date().toLocaleTimeString('de-DE'):''}
const grp={robin:'R',allg:'A',nf:'N'};
function pool(){return CARDS.map((_,i)=>i).filter(i=>!S.struck[i]&&(S.filter==='alle'||CARDS[i][0]===grp[S.filter]))}
const sc=i=>(S.st[i]&&S.st[i].s)||0;
const cn=i=>S.cnt[i]||{n:0,r:0,w:0};
function startRound(){S.queue=shuffle(pool().filter(i=>sc(i)<REQ));S.pos=0;resetCard()}
function resetCard(){S.picked=null;S.shown=false;const c=cur();S.options=c<0?[]:shuffle([CARDS[c][2],...CARDS[c][3]])}
const cur=()=>S.pos<S.queue.length?S.queue[S.pos]:-1;
function pick(k){const c=cur();if(S.picked!==null||c<0)return;const o=S.options[k];S.picked=o;const ok=o===CARDS[c][2];
 S.st[c]={s:ok?sc(c)+1:0};const p=cn(c);S.cnt[c]={n:p.n+1,r:p.r+(ok?1:0),w:p.w+(ok?0:1)};
 if(!ok)S.queue.push(c);persist();render()}
function next(){S.pos++;resetCard();render()}
function strike(i){S.struck[i]=true;S.queue=S.queue.filter((x,k)=>k<S.pos||x!==i);persist();resetCard();render()}
function unstrike(i){delete S.struck[i];persist();render()}
function stat(ids){const act=ids.filter(i=>!S.struck[i]);let r=0,w=0;ids.forEach(i=>{r+=cn(i).r;w+=cn(i).w});
 return{act:act.length,str:ids.length-act.length,seen:ids.filter(i=>cn(i).n>0).length,n:r+w,r,w,pct:r+w?Math.round(r/(r+w)*100):0,lern:act.filter(i=>sc(i)>=REQ).length}}
function render(){
 const d=DAYS.find(x=>x.key===S.day);const dd=d.tasks.filter(t=>S.done[t.id]).length;
 let h='';
 h+=`<div class="status ${S.storageOk?'ok':'bad'}">${S.storageOk?`Speichern: aktiv${S.lastSave?` (zuletzt gespeichert ${S.lastSave})`:''}`:'Speichern nicht möglich in diesem Browser (z. B. privater Modus). Bitte per Export sichern.'}</div>`;
 h+=`<h2>Tagesplan</h2><div class="seg">${DAYS.map(x=>`<button class="${x.key===S.day?'on':''}" data-day="${x.key}">${esc(x.label)}</button>`).join('')}</div>
 <p>${esc(d.note)} Erledigt: ${dd} von ${d.tasks.length}.</p>${d.tasks.map(t=>`<label class="task"><input type="checkbox" data-task="${t.id}" ${S.done[t.id]?'checked':''}> <span>${esc(t.t)}</span></label>`).join('')}`;
 const all=CARDS.map((_,i)=>i),t=stat(all),cat=g=>stat(all.filter(i=>CARDS[i][0]===g));
 const row=(n,s)=>`<tr><td>${n}</td><td>${s.act}</td><td>${s.str}</td><td>${s.seen}</td><td>${s.n}</td><td>${s.r}</td><td>${s.w}</td><td>${s.n?s.pct+' %':'–'}</td><td>${s.lern}</td></tr>`;
 h+=`<h2>Quiz</h2><p>Übersicht: ${t.act} aktive Fragen, ${t.str} gestrichen. Mindestens einmal gesehen: ${t.seen}. Antworten: ${t.n}, davon richtig ${t.r} und falsch ${t.w}${t.n?` (${t.pct} % richtig)`:''}. Gelernt (3 nacheinander richtig): ${t.lern}.</p>
 <div class="tw"><table><tr><th>Kategorie</th><th>Aktiv</th><th>Gestr.</th><th>Gesehen</th><th>Antw.</th><th>Richtig</th><th>Falsch</th><th>%</th><th>Gelernt</th></tr>${row('Robin',cat('R'))}${row('Allgemein',cat('A'))}${row('F-GNNF',cat('N'))}</table></div>`;
 const P=pool(),mastered=P.filter(i=>sc(i)>=REQ).length;
 h+=`<div class="seg">${[['alle','Alle'],['robin','Robin'],['allg','Allgemein'],['nf','F-GNNF & Prüferfragen']].map(([v,l])=>`<button class="${v===S.filter?'on':''}" data-filter="${v}">${l}</button>`).join('')}</div>
 <label class="task"><input type="checkbox" id="oral" ${S.oral?'checked':''}> <span>Erst laut antworten (wie in der mündlichen Prüfung)</span></label>
 <p>Sitzt: ${mastered} von ${P.length}. Eine Frage sitzt nach 3 richtigen Antworten nacheinander; eine falsche setzt sie auf null. Gespeichert wird nach jeder Antwort.</p>`;
 const c=cur();
 if(c>=0){const C=CARDS[c],s=Math.min(sc(c),REQ);
  h+=`<div class="card"><div class="h3">Frage ${S.pos+1} von ${S.queue.length}</div><div class="meta">${esc(C[5])} · Fortschritt ${'●'.repeat(s)+'○'.repeat(REQ-s)} · gesehen ${cn(c).n}×</div><p class="q">${esc(C[1])}</p>`;
  if(S.oral&&!S.shown&&S.picked===null)h+=`<button class="primary" id="show">Antworten zeigen</button>`;
  else h+=S.options.map((o,k)=>{let cl='opt';if(S.picked!==null&&o===C[2])cl+=' right';else if(S.picked===o)cl+=' wrong';return`<button class="${cl}" data-opt="${k}">${esc(o)}</button>`}).join('');
  if(S.picked!==null){const ok=S.picked===C[2];h+=`<p class="${ok?'okt':'badt'}"><b>${ok?'Richtig':'Falsch. Richtig: '+esc(C[2])}</b></p><p class="sub">${esc(C[4])}</p><button class="primary" id="next">Weiter</button>`}
  h+=`<label class="lbl">Meine Notiz / Korrektur zu dieser Frage<input id="note" type="text" value="${esc(S.notes[c]||'')}" placeholder="z. B. Wert in der NF anders, Fluglehrer sagt …"></label><button id="strike">Frage streichen</button></div>`;
 }else if(mastered===P.length)h+=`<div class="status ok">Alle Fragen in dieser Auswahl sitzen.</div>`;
 else h+=`<p>Runde fertig. Neue Runde starten, am besten in einer anderen Pause.</p><button class="primary" id="newround">Neue Runde starten</button>`;
 h+=`<p><button id="reset">Quiz zurücksetzen</button></p>`;
 const sk=Object.keys(S.struck);
 if(sk.length){h+=`<label class="task"><input type="checkbox" id="showStruck" ${S.showStruck?'checked':''}> <span>Gestrichene anzeigen (${sk.length})</span></label>`;
  if(S.showStruck)h+=sk.map(k=>`<div class="srow"><span>${esc(CARDS[+k][1])}</span><button data-unstrike="${k}">Zurückholen</button></div>`).join('')}
 h+=`<h2>Sichern (Export / Import)</h2><p>Fortschritt, Notizen und gestrichene Fragen liegen im Browser dieses Geräts. Für Backup oder anderes Gerät: Exportieren, Text kopieren, dort einfügen und Importieren.</p>
 <button class="primary" id="export">Exportieren</button> <button id="import">Importieren</button>${S.ioMsg?`<p>${esc(S.ioMsg)}</p>`:''}<textarea id="io" rows="5" placeholder="Backup-Text hier einfügen"></textarea>`;
 h+=`<h2>Routen</h2>${ROUTES.map(r=>`<p><b>${esc(r.title)}</b><br>${esc(r.detail)}</p>`).join('')}<div class="tw"><table>${PROPS.map(p=>`<tr><td>${esc(p.label)}</td><td>${esc(p.value)}</td></tr>`).join('')}</table></div>`;
 h+=`<h2>Widersprüche AFM vs. Checkliste</h2><p>${esc(CONTRA)}</p>`;
 const io=$('#io')?$('#io').value:'';
 $('#app').innerHTML=h;if($('#io'))$('#io').value=io;
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.day){S.day=b.dataset.day;render()}
 else if(b.dataset.filter){S.filter=b.dataset.filter;startRound();render()}
 else if(b.dataset.opt!==undefined)pick(+b.dataset.opt);
 else if(b.dataset.unstrike!==undefined)unstrike(+b.dataset.unstrike);
 else if(b.id==='show'){S.shown=true;render()}
 else if(b.id==='next')next();
 else if(b.id==='strike')strike(cur());
 else if(b.id==='newround'){startRound();render()}
 else if(b.id==='reset'){if(confirm('Fortschritt wirklich zurücksetzen?')){S.st={};S.cnt={};persist();startRound();render()}}
 else if(b.id==='export'){const notizen_lesbar=Object.keys(S.notes).map(k=>({nr:+k,frage:CARDS[+k][1],notiz:S.notes[k]}));
  const txt=JSON.stringify({v:1,datum:new Date().toISOString(),st:S.st,cnt:S.cnt,struck:S.struck,notes:S.notes,done:S.done,notizen_lesbar});
  S.ioMsg='Backup steht unten. Komplett markieren und kopieren.';render();$('#io').value=txt;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='checkride-backup.json';a.click()}catch(_){}}
 else if(b.id==='import'){try{const d=JSON.parse($('#io').value);['st','cnt','struck','notes','done'].forEach(k=>{if(d[k])S[k]=d[k]});persist();S.ioMsg='Import erfolgreich.';startRound()}catch(_){S.ioMsg='Import fehlgeschlagen: Text ist kein gültiges Backup.'}render()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.task){S.done[t.dataset.task]=t.checked;persist();render()}
 else if(t.id==='oral'){S.oral=t.checked;save('cr_oral',S.oral);render()}
 else if(t.id==='showStruck'){S.showStruck=t.checked;render()}});
document.addEventListener('input',e=>{if(e.target.id==='note'){const c=cur(),v=e.target.value;if(v)S.notes[c]=v;else delete S.notes[c];persist();
 const st=document.querySelector('.status');if(st){st.className='status '+(S.storageOk?'ok':'bad');st.textContent=S.storageOk?`Speichern: aktiv (zuletzt gespeichert ${S.lastSave})`:'Speichern nicht möglich in diesem Browser (z. B. privater Modus). Bitte per Export sichern.'}}});
startRound();render();
</script></body></html>
